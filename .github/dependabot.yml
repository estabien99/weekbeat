# Dependency updates (see CLAUDE.md → "Dependency security").
# - Weekly; patch + minor version updates grouped into one PR per ecosystem.
# - Cooldown: a new release is only proposed after 5 days, which protects against freshly published malicious
#   versions. GitHub applies cooldown to version updates only; security updates are always opened at once.
# - Patch/minor PRs are auto-merged by .github/workflows/dependabot-auto-merge.yml once all required checks pass.
#   Major updates are never auto-merged: Claude reads the changelog and adapts the code.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; lift together.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Must match the Chromium pre-installed in cloud sessions; bump deliberately.
      - dependency-name: '@playwright/test'
      # Must match the Node runtime in .nvmrc and CI (22); raise Node, .nvmrc and these types together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
