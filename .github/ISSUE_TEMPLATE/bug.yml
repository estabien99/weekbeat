name: Bug report / Fehler melden
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: Please do not paste health data or keys.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Schritte
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / Erwartet
  - type: input
    id: env
    attributes:
      label: Device, browser, app version / Gerät, Browser, Version
