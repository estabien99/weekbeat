name: Feature idea / Idee
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does it solve? / Welches Problem löst es?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea / Idee
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: Works without any connector (manual entry stays possible)
        - label: Keeps data on the device
