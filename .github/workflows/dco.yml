name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%an <%ae>' "$c")
            if ! git show -s --format=%B "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $c by $author has no matching Signed-off-by line (use git commit -s)."
              missing=1
            fi
          done
          exit $missing
