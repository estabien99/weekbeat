# Publishes the app from main to GitHub Pages.
# Off until the maintainer decides: it deploys on push only when the repository variable PAGES_ENABLED is "true"
# (Settings → Secrets and variables → Actions → Variables). A manual run (Actions → Pages → Run workflow) always
# deploys. Pages must be set to "GitHub Actions" as its source (Settings → Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running deployment is not cancelled halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run build
        env:
          # e.g. "/weekbeat/" for https://<owner>.github.io/weekbeat/; "/" on a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Check the PWA build
        run: test -f dist/sw.js && test -f dist/manifest.webmanifest
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
